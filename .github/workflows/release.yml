name: Release

# Builds the double-click apps testers download: booth.exe for Windows and booth for macOS (Apple silicon
# only; macos-latest runners are arm64).
# Push a tag like v0.1.0 to publish them on a GitHub release; run it by hand to just build them.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            file: booth.exe
            asset: RadioBooth-Windows.exe
          - os: macos-latest
            file: booth
            asset: RadioBooth-macOS.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
        with:
          version: "0.13.6"  # pinned: bump only to a uv release at least 7 days old
      - run: uv sync --locked --group build
      - run: uv run pytest
      - run: uv run --locked --group build pyinstaller --onefile --name booth src/radiobooth/__main__.py
      - run: ./dist/${{ matrix.file }} --version
        shell: bash
      - if: runner.os == 'Windows'
        run: mv dist/booth.exe dist/${{ matrix.asset }}
        shell: bash
      # A .command file opens in Terminal when double-clicked; the zip keeps it runnable after download.
      - if: runner.os == 'macOS'
        run: |
          mkdir pkg && mv dist/booth "pkg/Radio Booth.command" && chmod +x "pkg/Radio Booth.command"
          ditto -c -k "pkg/Radio Booth.command" "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write  # only this job publishes the release
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - run: >-
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY"
          --title "Radio Booth $GITHUB_REF_NAME"
          --notes "Download the file for your computer. Setup steps:
          https://github.com/$GITHUB_REPOSITORY/blob/main/docs/getting-started.md"
        env:
          GH_TOKEN: ${{ github.token }}
