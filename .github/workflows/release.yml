name: Release

# Builds the double-click apps testers download: RadioBooth-Windows.exe, and Radio Booth.app for macOS (one
# app for Apple silicon and Intel: Booth is built on an arm64 and an Intel runner, then put together).
# Two ways to publish them on a GitHub release: push a tag like v0.1.0, or run this workflow by hand on main
# with "release" set to the version in pyproject.toml (the workflow then makes the tag itself). Run it by hand
# with "release" empty to just build them.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Version to release, e.g. 0.2.4 (must match pyproject.toml). Leave empty to just build."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  # Works out which release this run publishes, if any, and refuses a version that doesn't match the code.
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - id: tag
        env:
          REQUESTED: ${{ inputs.release }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)
          tag=""
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
          elif [ -n "$REQUESTED" ]; then
            if [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "::error::Releases are made from main, not $GITHUB_REF_NAME"; exit 1
            fi
            tag="v${REQUESTED#v}"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
              echo "::error::$tag already exists"; exit 1
            fi
          fi
          if [ -n "$tag" ] && [ "$tag" != "v$version" ]; then
            echo "::error::$tag doesn't match pyproject.toml's version $version"; exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Release: ${tag:-none (build only)}"

  build:
    needs: version
    strategy:
      matrix:
        include:
          - os: windows-latest
            file: booth.exe
            asset: RadioBooth-Windows.exe
            # The On Air icon and the file details Explorer and Task Manager show (see packaging/). No
            # console window: Booth runs in the background and shows its page in the browser.
            brand: --icon packaging/booth.ico --version-file version_info.txt --noconsole
          - os: macos-latest  # Apple silicon
            file: booth
            asset: booth-arm64
            python: only-managed
          - os: macos-15-intel
            file: booth
            asset: booth-x86_64
            python: only-managed
    runs-on: ${{ matrix.os }}
    env:
      # Both halves of the Mac app must bundle the same Python (they share one NOTICES.txt), and the two
      # Mac runners come with different ones: use the Python the pinned uv provides there instead.
      UV_PYTHON_PREFERENCE: ${{ matrix.python || 'managed' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
        with:
          version: "0.13.6"  # pinned: bump only to a uv release at least 7 days old
      - run: uv sync --locked --group build
      - run: uv run pytest
      # Testers' Macs lack the certificates the app's Python was built with; check macOS's own list works.
      - if: runner.os == 'macOS'
        run: uv run python packaging/check_https.py
      - if: runner.os == 'Windows'
        run: uv run python packaging/version_info.py > version_info.txt
        shell: bash
      # The GPL and the notices for what's bundled (Python itself) go inside the program, so they travel
      # with every copy, self-updates included. The source link names the release's tag, or for a build
      # that isn't a release, its commit.
      - run: uv run python packaging/notices.py "$REF" > NOTICES.txt
        shell: bash
        env:
          REF: ${{ needs.version.outputs.tag || github.sha }}
      - run: >-
          uv run --locked --group build pyinstaller --onefile --name booth ${{ matrix.brand }}
          --add-data LICENSE:. --add-data NOTICES.txt:.
          src/radiobooth/__main__.py
        shell: bash
      - run: ./dist/${{ matrix.file }} --version
        shell: bash
      - run: mv dist/${{ matrix.file }} dist/${{ matrix.asset }}
        shell: bash
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
      # The license and notices built in, for the Mac app's Resources and the release page.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: notices-${{ matrix.asset }}
          path: |
            LICENSE
            NOTICES.txt

  mac-app:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
        with:
          version: "0.13.6"  # pinned: bump only to a uv release at least 7 days old
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          pattern: booth-*
          path: bin
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: notices-booth-arm64
          path: notices
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: notices-booth-x86_64
          path: notices-x86_64
      # The app holds both chips' programs but one NOTICES.txt: they must have bundled the same Python.
      - run: |
          if ! cmp -s notices/NOTICES.txt notices-x86_64/NOTICES.txt; then
            echo "::error::The arm64 and Intel builds bundle different Pythons; their notices differ:"
            diff notices/NOTICES.txt notices-x86_64/NOTICES.txt | head -20; exit 1
          fi
      # The app's main program: one file for both chips, which starts the Booth built for this Mac.
      - run: >-
          clang -arch arm64 -arch x86_64 -mmacosx-version-min=11.0 -Os -Wall -Werror
          -o bin/launcher packaging/macos/launcher.c
      - run: >-
          uv run --no-project python packaging/mac_app.py dist bin/launcher bin/booth-arm64 bin/booth-x86_64
          notices/NOTICES.txt
      # Not signed by a developer yet (no Apple Developer ID), so signed ad hoc: Apple silicon needs a
      # signature to run anything, and an intact one lets macOS offer "Open Anyway" instead of "damaged".
      - run: |
          codesign --force --sign - "dist/Radio Booth.app"
          codesign --verify --deep --strict --verbose=2 "dist/Radio Booth.app"
      - run: |
          "dist/Radio Booth.app/Contents/MacOS/Radio Booth" --version
          if arch -x86_64 /usr/bin/true 2>/dev/null; then  # the Intel half too, if Rosetta is here
            arch -x86_64 "dist/Radio Booth.app/Contents/MacOS/Radio Booth" --version
          fi
      # ditto keeps the app's permissions and signature through the zip; Safari unzips it on download.
      - run: ditto -c -k --keepParent "dist/Radio Booth.app" dist/RadioBooth-macOS.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: RadioBooth-macOS.zip
          path: dist/RadioBooth-macOS.zip

  publish:
    if: needs.version.outputs.tag != ''
    needs: [version, build, mac-app]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # only this job publishes the release
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          pattern: RadioBooth-*  # the downloads, not the per-chip programs inside the Mac app
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: notices-RadioBooth-Windows.exe
          path: notices/windows
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: notices-booth-arm64
          path: notices/macos
      # Next to the downloads: the license built in, and each app's notices (from the Python it bundles).
      - run: |
          cp notices/windows/LICENSE dist/LICENSE.txt
          cp notices/windows/NOTICES.txt dist/NOTICES-Windows.txt
          cp notices/macos/NOTICES.txt dist/NOTICES-macOS.txt
      # The apps update themselves only to files that match these checksums.
      - run: cd dist && sha256sum RadioBooth-* > SHA256SUMS && cat SHA256SUMS
      # On a run started by hand this also makes the tag, on the commit that was built. (A tag made with
      # this token doesn't start the workflow again.)
      - run: >-
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"
          --title "Radio Booth $TAG" --notes "$NOTES"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          NOTES: |
            Download the file for your computer. [Setup steps](https://github.com/${{ github.repository }}/blob/main/docs/getting-started.md)

            Booth is free software under the GNU GPL, version 3 or later, with no warranty (LICENSE.txt). The apps also contain Python, the PyInstaller bootloader, mutagen, and PyAV with FFmpeg, under their own licenses (NOTICES-Windows.txt, NOTICES-macOS.txt). [Source code for this release](https://github.com/${{ github.repository }}/tree/${{ needs.version.outputs.tag }})
