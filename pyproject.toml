[project]
name = "radiobooth"
version = "0.1.3"
description = "Booth Engineer: the home client for Radio Booth. Turns your own music library into radio shows with an AI DJ."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
booth = "radiobooth.cli:main"

[dependency-groups]
dev = [
    "jsonschema>=4.23",
    "pytest>=8",
    "referencing>=0.35",
    "ruff>=0.15",
]
# Only the release workflow installs this (`--group build`), so a plain `uv sync` stays light.
build = [
    "pyinstaller==6.22.3",
]

[tool.uv]
# Supply-chain cooldown: never resolve a package version published in the last 7 days.
exclude-newer = "7 days"

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
