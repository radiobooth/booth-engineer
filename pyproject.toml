[project]
name = "radiobooth"
version = "0.0.1"
description = "Booth Engineer: the home client for Radio Booth. Turns your own music library into radio shows with an AI DJ."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
booth = "radiobooth.cli:main"

[dependency-groups]
dev = [
    "jsonschema>=4.23",
    "pytest>=8",
    "referencing>=0.35",
    "ruff>=0.15",
]

[build-system]
requires = ["uv_build>=0.9,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
